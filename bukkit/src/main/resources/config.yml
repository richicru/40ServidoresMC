debug: false
clave: key
broadcast:
    activado: true
    mensajeBroadcast: '&aGracias a {0} por votarnos! El ya ha obtenido su premio, usa &2/voto40&a y obten el tuyo'
mensaje: '&6Gracias por votarnos! Aqui tienes tu premio: '
comandosCustom:
- money add {0} 10
# URL de la API de 40servidoresmc.es. Por defecto el plugin va directo al
# host canónico (www.). Override sólo si cambia el dominio o si la web expone
# un endpoint distinto en algún mirror.
api-url: https://www.40servidoresmc.es/api2.php?clave=
# Timeout de lectura HTTP (ms). Subido a 10s por defecto: el protocolo actual
# marca el voto como "reclamado" en el servidor antes de que llegue la respuesta,
# y un timeout corto puede consumir el voto sin entregar el premio al jugador.
readTimeOut: 10000
cooldown: 60
update-repo: richicru/40ServidoresMC
update-branch: dev
log-ip: false
# TTL en segundos para la cache de /stats40 (separada de la de placeholders).
# 0 o negativo desactiva la cache para /stats40 (siempre llama a la API).
stats-cmd-cache-seconds: 30
tag: "&8[&b40ServidoresMC&8]"

# Mensajes traducibles. Cualquier clave omitida usará el valor por defecto en español.
# Para traducir, sobrescribe solo las claves que necesites:
# messages:
#   vote-already-rewarded: "&aThanks for voting, but you already got your reward!"
#   cmd-no-permission: "&cYou don't have permission to use this command"
messages: {}

configVer: 4