plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "7.1.0"
    id "io.freefair.lombok" version "6.4.3"
}

repositories {
  maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation project(':common')
  implementation 'org.bstats:bstats-bukkit:3.0.0'
  // Spigot API como compileOnly: compatible con Spigot 1.16.5+ y con Paper.
  // Para Folia usamos reflection en runtime (no son necesarias APIs de compilación).
  compileOnly 'org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT'
  // PlaceholderAPI desde JitPack (repo.extendedclip.com caído)
  compileOnly 'com.github.PlaceholderAPI:PlaceholderAPI:2.10.9'
}

shadowJar {
    archiveBaseName.set(rootProject.name)
    archiveClassifier.set('Bukkit')
    archiveVersion.set(version)

    relocate 'org.bstats', 'com.cadiducho.cservidoresmc.lib.bstats'
    relocate 'ninja.leaping.configurate', 'com.cadiducho.cservidoresmc.lib.configurate'
    relocate 'com.google.gson', 'com.cadiducho.cservidoresmc.lib.gson'
}

artifacts {
    archives shadowJar
}